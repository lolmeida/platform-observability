name: Publish release
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', server-id: github, settings-path: '${{ github.workspace }}'}
      - name: Configure Maven repository
        run: |
          cat > settings.xml <<'XML'
          <settings><servers><server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server></servers></settings>
          XML
      - name: Reject snapshots
        run: '! grep -R "SNAPSHOT" --include="pom.xml" .'
      - run: ./mvnw -s settings.xml -B -ntp deploy -DskipTests=false -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
